name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/crm-application
            git fetch origin main
            git reset --hard origin/main
            cd backend

            set_env_var() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                return
              fi
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            set_env_var TELEGRAM_BOT_TOKEN "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            set_env_var TELEGRAM_BOT_USERNAME "${{ secrets.TELEGRAM_BOT_USERNAME }}"
            set_env_var TELEGRAM_WEBHOOK_URL "${{ secrets.TELEGRAM_WEBHOOK_URL }}"
            set_env_var TELEGRAM_WEBHOOK_SECRET "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"
            set_env_var TELEGRAM_CHAT_ID "${{ secrets.TELEGRAM_CHAT_ID }}"
            set_env_var TELEGRAM_ADMIN_CHAT_ID "${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}"
            set_env_var TELEGRAM_MODE "polling"
            set_env_var TELEGRAM_APPROVER_EMPLOYEE_ID "${{ secrets.TELEGRAM_APPROVER_EMPLOYEE_ID }}"
            if ! grep -q '^TELEGRAM_APPROVER_EMPLOYEE_ID=' .env 2>/dev/null; then
              echo 'TELEGRAM_APPROVER_EMPLOYEE_ID=EMP0005' >> .env
            fi
            if grep -q '^TELEGRAM_APPROVER_EMPLOYEE_ID=$' .env 2>/dev/null; then
              sed -i 's|^TELEGRAM_APPROVER_EMPLOYEE_ID=$|TELEGRAM_APPROVER_EMPLOYEE_ID=EMP0005|' .env
            fi

            # Prove Telegram token is present (do not print the secret)
            if grep -q '^TELEGRAM_BOT_TOKEN=.\+' .env; then
              echo "TELEGRAM_BOT_TOKEN is set"
            else
              echo "ERROR: TELEGRAM_BOT_TOKEN missing in .env"
              exit 1
            fi

            pip3 install -r requirements.txt --quiet
            sudo systemctl restart uvicorn
            sleep 3
            sudo systemctl is-active uvicorn
            grep -n "_notify_task_assigned_telegram" server.py | head -3
            python3 - <<'PY'
            from dotenv import load_dotenv
            load_dotenv(".env")
            from telegram_notify import telegram_enabled, send_telegram_message_verbose
            from sqlalchemy import create_engine, text
            import os
            assert telegram_enabled(), "telegram_enabled() is False"
            engine = create_engine(os.environ["DATABASE_URL"])
            with engine.connect() as c:
                chat = c.execute(text("SELECT telegram_chat_id FROM employees WHERE employee_id='EMP0018'")).scalar()
            print("EMP0018 chat", chat)
            if chat:
                ok, err = send_telegram_message_verbose("Resoline deploy check: task Telegram notify is live on server.", chat)
                print("deploy telegram test:", ok, err)
                assert ok, err
            print("telegram outbound OK")
            PY
